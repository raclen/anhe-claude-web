name: CI

# CI 只做「不需要 Claude Code 凭据」的那部分：类型检查、构建、产物完整性。
# 端到端验收（scripts/accept.mjs）需要一个能连通的模型上游，那是 key，不能进 CI 的
# secrets —— 泄露一次就得换。所以 accept 只在本地 `pnpm accept` 跑，由人盯着看。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建
        run: pnpm build

      - name: 产物完整性（npm 包里该有的都在）
        run: node scripts/verify-dist.mjs

      - name: 打包
        run: npm pack

      - name: 上传 tarball
        uses: actions/upload-artifact@v4
        with:
          name: anhe-claude-web-tarball
          path: '*.tgz'
          retention-days: 7
